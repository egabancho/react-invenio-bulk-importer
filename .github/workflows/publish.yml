name: Publish to NPM

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
        
      - name: Install dependencies (also generates PandaCSS)
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        run: pnpm type-check
        
      - name: Lint and format
        run: |
          pnpm biome check . --fix
          pnpm tsc --noEmit
          pnpm syncpack
        
      - name: Build package
        run: pnpm build
        
      - name: Publish to NPM
        run: npm publish --provenance --access public
